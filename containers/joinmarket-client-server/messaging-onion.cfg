
## ONION MESSAGING in reference "testing mode": joins the joinmarket-ng
## directory server over plain TCP (no Tor). regtest_count != 0,0 switches
## jmdaemon.onionmc into testing mode, where directory_nodes are dialled with
## reactor.connectTCP and the bot serves on localhost only (its advertised
## location 127.0.0.1:8080 is unreachable to peers, so all private messages
## are relayed through the directory server).
################################################################################
[MESSAGING:onion]
type = onion
socks5_host = localhost
socks5_port = 9050
tor_control_host = localhost
tor_control_port = 9051
onion_serving_host = 127.0.0.1
onion_serving_port = 8080
hidden_service_dir =
directory_nodes = @@DIRECTORY_NODES@@
regtest_count = 1,1
