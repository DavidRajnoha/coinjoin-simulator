apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: emulation-manager
    component: orchestrator
  name: emulation-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emulation-manager
  template:
    metadata:
      labels:
        app: emulation-manager
        component: orchestrator
    spec:
      containers:
      - command:
        - sleep
        - infinity
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: SIMULATION_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: drajnoha/emulator-manager
        imagePullPolicy: Always
        name: manager
        resources:
          limits:
            cpu: 2000m
            memory: 6Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /workspace
          name: workspace
        # manager.py stores run archives under ./logs (= /app/logs); without this mount they sit
        # on the container's overlay and are lost on any pod restart, OOMKill or rollout.
        # /workspace/logs must exist and be owned by uid 1000 before the first start.
        - mountPath: /app/logs
          name: workspace
          subPath: logs
        workingDir: /app
      serviceAccountName: emulation-manager
      volumes:
      - name: workspace
#        emptyDir: {}
        # To enable persistent storage across crashes:
        # 1. Create PVC: kubectl apply -f containers/emulator-manager/pvc.yaml
        # 2. Uncomment below and comment out emptyDir above
        persistentVolumeClaim:
         claimName: emulation-manager-workspace
